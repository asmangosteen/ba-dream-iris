<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Iris</title>
<style>
  :root { color-scheme: light dark; --bg: #FFFFFF; --fg: #202837; --sub: #6B7280; --btn: #202837; --btn-fg: #FDFDFD; }
  @media (prefers-color-scheme: dark) { :root { --bg: #03091A; --fg: #F3F4F6; --sub: #9CA3AF; --btn: #F3F4F6; --btn-fg: #202837; } }
  html, body { height: 100%; margin: 0; }
  body { display: grid; place-items: center; background: var(--bg); color: var(--fg);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "Pretendard", sans-serif; -webkit-user-select: none; user-select: none; }
  main { text-align: center; padding: 16px; }
  h1 { font-size: 18px; font-weight: 600; margin: 0 0 6px; }
  p { margin: 0 0 20px; color: var(--sub); }
  button { font: inherit; font-weight: 600; padding: 8px 18px; border: 0; border-radius: 10px; corner-shape: squircle; background: var(--btn); color: var(--btn-fg); cursor: pointer; }
</style>
</head>
<body>
<main>
  <h1>Can't reach Iris</h1>
  <p>Check your internet connection and try again.</p>
  <button id="retry" autofocus>Try again</button>
</main>
<script>
  const to = new URLSearchParams(location.search).get('to')
  const retry = () => { if (to) location.href = to }
  document.getElementById('retry').addEventListener('click', retry)
  window.addEventListener('online', retry)
</script>
</body>
</html>
