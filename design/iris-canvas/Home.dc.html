<html lang="ko">
<head>

</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
</style>
</helmet>
<div style="width: 100%; min-height: 900px; display: flex; flex-direction: column; background: var(--sys-color-common-white-default); font-family: var(--font-family-base); color: var(--sys-color-neutral-800); font-size: var(--typography-body-2-size); line-height: 22px">

  <header style="height: 60px; flex: none; display: flex; align-items: center; gap: var(--ref-spacing-14); padding: 0 var(--ref-spacing-12); box-shadow: 0 1px 0 var(--iris-line); flex-wrap: wrap">
    <a href="Home.dc.html" aria-label="Iris 홈" style="display: flex; align-items: center; gap: var(--ref-spacing-06)">
      <img src="/_blob/cc75c291bd789b4d958c366f3abe86ce" alt="" style="height: 16px; width: auto; display: block">
      <span style="font-weight: 600; font-size: 17px; color: var(--sys-color-common-black-default)">Iris</span>
    </a>
    <nav aria-label="주 메뉴" style="display: flex; gap: var(--ref-spacing-04)">
      <a href="Home.dc.html" style="padding: var(--ref-spacing-05) var(--ref-spacing-08); border-radius: var(--ref-radius-04); font-weight: 600; color: var(--sys-color-neutral-800)">프로젝트</a>
      <a href="Requirements.dc.html" class="hov" style="padding: var(--ref-spacing-05) var(--ref-spacing-08); border-radius: var(--ref-radius-04); font-weight: 500; color: var(--sys-color-neutral-600)">요구사항</a>
      <a href="DesignSystem.dc.html" class="hov" style="padding: var(--ref-spacing-05) var(--ref-spacing-08); border-radius: var(--ref-radius-04); font-weight: 500; color: var(--sys-color-neutral-600)">디자인 시스템</a>
    </nav>
    <div style="margin-left: auto; display: flex; align-items: center; gap: var(--ref-spacing-06)">
      <label style="display: flex; align-items: center; gap: var(--ref-spacing-06); height: 36px; min-width: 240px; padding: 0 var(--ref-spacing-08); border-radius: var(--ref-radius-05); box-shadow: inset 0 0 0 1px var(--iris-line-strong); color: var(--sys-color-neutral-500)">
        <span class="ic i-search" aria-hidden="true"></span><span class="sr">검색</span>
        <input placeholder="프로젝트, 화면, 요구사항 검색" style="flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 14px; color: var(--sys-color-neutral-800)">
      </label>
      <button aria-label="알림" class="hov" style="width: 36px; height: 36px; border-radius: var(--ref-radius-05); display: grid; place-items: center; color: var(--sys-color-neutral-600)"><span class="ic ic-20 i-bell" aria-hidden="true"></span></button>
      <span aria-label="김기획" style="width: 32px; height: 32px; border-radius: 50%; background: var(--sys-color-neutral-800); color: var(--sys-color-common-white-default); display: grid; place-items: center; font-size: 13px; font-weight: 600">김</span>
    </div>
  </header>

  <section aria-label="새 프로젝트 시작" style="position: relative; overflow: hidden; padding: var(--ref-spacing-17) var(--ref-spacing-16) var(--ref-spacing-16)">
    <div class="aurora" aria-hidden="true">
      <i style="width: 420px; height: 300px; left: -80px; top: -120px; background: var(--ref-color-blue-200)"></i>
      <i style="width: 360px; height: 260px; left: 30%; top: -140px; background: var(--ref-color-yellow-100)"></i>
      <i style="width: 380px; height: 280px; right: 12%; top: -80px; background: var(--ref-color-turquoise-100)"></i>
      <i style="width: 320px; height: 240px; right: -60px; top: 40px; background: var(--ref-color-red-100)"></i>
      <i style="width: 300px; height: 220px; left: 18%; top: 120px; background: var(--ref-color-purple-100)"></i>
    </div>
    <div style="position: relative; max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: var(--ref-spacing-12)">
      <div style="display: flex; flex-direction: column; gap: var(--ref-spacing-06)">
        <h1 style="margin: 0; font-size: var(--typography-display-size); line-height: 48px; letter-spacing: -0.36px; font-weight: 700; color: var(--sys-color-common-black-default)">좋은 아침이에요, 김기획님</h1>
        <p style="margin: 0; font-size: var(--typography-body-1-size); line-height: 26px; color: var(--sys-color-neutral-600)">확인할 미반영 요구사항이 7개 있어요.</p>
      </div>
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: var(--ref-spacing-08)">
        <a href="Main.dc.html" class="hov" style="display: flex; align-items: center; gap: var(--ref-spacing-08); padding: var(--ref-spacing-10); border-radius: var(--ref-radius-07); background: var(--sys-color-common-white-default); box-shadow: inset 0 0 0 1px var(--iris-line-strong)">
          <span style="width: 30px; height: 44px; border-radius: var(--ref-radius-03); box-shadow: inset 0 0 0 1.5px var(--sys-color-brand-primary-default); flex: none"></span>
          <span style="display: flex; flex-direction: column"><span style="font-weight: 600; font-size: 16px; line-height: 24px">앱 화면</span><span style="color: var(--sys-color-neutral-600)">375 × 812 · 바드림 앱</span></span>
        </a>
        <a href="Main.dc.html" class="hov" style="display: flex; align-items: center; gap: var(--ref-spacing-08); padding: var(--ref-spacing-10); border-radius: var(--ref-radius-07); background: var(--sys-color-common-white-default); box-shadow: inset 0 0 0 1px var(--iris-line-strong)">
          <span style="width: 44px; height: 30px; border-radius: var(--ref-radius-03); box-shadow: inset 0 0 0 1.5px var(--sys-color-neutral-800); flex: none"></span>
          <span style="display: flex; flex-direction: column"><span style="font-weight: 600; font-size: 16px; line-height: 24px">웹 화면</span><span style="color: var(--sys-color-neutral-600)">1080 · 파트너스 · 어드민</span></span>
        </a>
        <a href="Main.dc.html" class="hov" style="display: flex; align-items: center; gap: var(--ref-spacing-08); padding: var(--ref-spacing-10); border-radius: var(--ref-radius-07); background: var(--sys-color-common-white-default); box-shadow: inset 0 0 0 1px var(--iris-line-strong)">
          <span style="width: 24px; height: 44px; border-radius: var(--ref-radius-02); box-shadow: inset 0 0 0 1.5px var(--sys-color-neutral-800); flex: none"></span>
          <span style="display: flex; flex-direction: column"><span style="font-weight: 600; font-size: 16px; line-height: 24px">상세페이지</span><span style="color: var(--sys-color-neutral-600)">폭 860 · 섹션 단위</span></span>
        </a>
        <a href="AddDoc.dc.html" class="hov" style="display: flex; align-items: center; gap: var(--ref-spacing-08); padding: var(--ref-spacing-10); border-radius: var(--ref-radius-07); background: var(--sys-color-common-white-default); box-shadow: inset 0 0 0 1px var(--iris-line-strong)">
          <span style="width: 44px; height: 44px; border-radius: var(--ref-radius-04); box-shadow: inset 0 0 0 1px var(--iris-line-strong); color: var(--sys-color-neutral-800); display: grid; place-items: center; flex: none"><span class="ic ic-20 i-document_add" aria-hidden="true"></span></span>
          <span style="display: flex; flex-direction: column"><span style="font-weight: 600; font-size: 16px; line-height: 24px">기획 문서로 시작</span><span style="color: var(--sys-color-neutral-600)">문서를 올리면 요구사항을 찾아요</span></span>
        </a>
      </div>
    </div>
  </section>

  <main style="flex: 1; padding: 0 var(--ref-spacing-16) var(--ref-spacing-17)">
    <div style="max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: var(--ref-spacing-10)">
      <div style="display: flex; align-items: center; justify-content: space-between; gap: var(--ref-spacing-08); flex-wrap: wrap">
        <h2 style="margin: 0; font-size: var(--typography-heading-2-size); line-height: 32px; font-weight: 700; color: var(--sys-color-common-black-default)">프로젝트</h2>
        <div role="tablist" aria-label="프로젝트 거르기" style="display: flex; gap: var(--ref-spacing-04)">
          <sc-for list="{{filters}}" as="f" hint-placeholder-count="4">
            <button role="tab" aria-selected="{{f.on}}" onClick="{{f.pick}}" style="{{f.style}}">{{f.label}} {{f.count}}</button>
          </sc-for>
        </div>
      </div>
      <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(272px, 1fr)); gap: var(--ref-spacing-10)">
        <sc-for list="{{projects}}" as="p" hint-placeholder-count="4">
          <a href="Main.dc.html" class="hov" style="display: flex; flex-direction: column; border-radius: var(--ref-radius-07); box-shadow: inset 0 0 0 1px var(--iris-line-strong); overflow: hidden">
            <div aria-hidden="true" style="height: 148px; background: var(--sys-color-neutral-100); display: flex; align-items: flex-end; justify-content: center; gap: var(--ref-spacing-06); padding-top: var(--ref-spacing-11); box-sizing: border-box; overflow: hidden; box-shadow: inset 0 -1px 0 var(--iris-line)">
              <span style="width: 64px; height: 128px; border-radius: 4px 4px 0 0; background: var(--sys-color-common-white-default); box-shadow: var(--shadow-01); display: flex; flex-direction: column; gap: 5px; padding: 8px; box-sizing: border-box"><span style="height: 6px; width: 70%; background: var(--ref-color-gray-900-10); border-radius: 3px"></span><span style="height: 26px; border-radius: 4px; box-shadow: inset 0 0 0 1px var(--ref-color-gray-900-10)"></span><span style="height: 26px; border-radius: 4px; box-shadow: inset 0 0 0 1px var(--ref-color-gray-900-10)"></span></span>
              <span style="width: 64px; height: 128px; border-radius: 4px 4px 0 0; background: var(--sys-color-common-white-default); box-shadow: var(--shadow-01); display: flex; flex-direction: column; gap: 5px; padding: 8px; box-sizing: border-box"><span style="height: 6px; width: 55%; background: var(--ref-color-gray-900-10); border-radius: 3px"></span><span style="height: 36px; border-radius: 4px; background: var(--sys-color-brand-primary-lightest)"></span><span style="margin-top: auto; height: 12px; border-radius: 3px; background: var(--sys-color-brand-primary-default)"></span></span>
              <span style="width: 64px; height: 128px; border-radius: 4px 4px 0 0; background: var(--sys-color-common-white-default); box-shadow: var(--shadow-01); display: flex; flex-direction: column; gap: 5px; padding: 8px; box-sizing: border-box"><span style="height: 6px; width: 80%; background: var(--ref-color-gray-900-10); border-radius: 3px"></span><span style="height: 40px; border-radius: 4px; background: var(--sys-color-neutral-100)"></span></span>
            </div>
            <div style="padding: var(--ref-spacing-08) var(--ref-spacing-10) var(--ref-spacing-10); display: flex; flex-direction: column; gap: var(--ref-spacing-06)">
              <div style="display: flex; align-items: center; justify-content: space-between; gap: var(--ref-spacing-06)">
                <span style="font-weight: 600; font-size: 16px; line-height: 24px">{{p.name}}</span>
                <span class="{{p.stageClass}}">{{p.stage}}</span>
              </div>
              <div style="display: flex; flex-direction: column; gap: var(--ref-spacing-04)">
                <div style="display: flex; justify-content: space-between; color: var(--sys-color-neutral-600)"><span>요구사항 반영</span><span><span style="color: var(--sys-color-neutral-800); font-weight: 600">{{p.done}}</span> / {{p.total}}</span></div>
                <div style="height: 4px; border-radius: 2px; background: var(--ref-color-gray-900-5); overflow: hidden"><span style="{{p.bar}}"></span></div>
              </div>
              <div style="display: flex; justify-content: space-between; font-size: 12px; line-height: 18px; color: var(--sys-color-neutral-600)"><span>화면 {{p.screens}} · 문서 {{p.docs}}</span><span>{{p.updated}}</span></div>
            </div>
          </a>
        </sc-for>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
const PROJECTS = [
  { name: '착한구독 신청 플로우 개편', stage: '디자인', done: 9, total: 13, screens: 13, docs: 3, updated: '10분 전 · 김기획' },
  { name: '내 차고 홈 리뉴얼', stage: '기획', done: 2, total: 11, screens: 6, docs: 2, updated: '어제 · 박디자' },
  { name: '커뮤니티 피드 개선', stage: '개발', done: 17, total: 18, screens: 9, docs: 4, updated: '3일 전 · 이개발' },
  { name: '단기구독 반납 흐름', stage: '디자인', done: 5, total: 9, screens: 8, docs: 1, updated: '11월 18일 · 박디자' },
  { name: '마이페이지 정리', stage: '완료', done: 12, total: 12, screens: 7, docs: 2, updated: '11월 10일 · 김기획' }
];
const STAGE = { '기획': 't-warning', '디자인': 't-brand', '개발': 't-turquoise', '완료': 't-gray' };
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { filter: 'active' };
  }
  renderVals() {
    const f = this.state.filter;
    const defs = [['active', '진행 중'], ['mine', '내가 참여'], ['done', '완료'], ['all', '전체']];
    const pick = (key) => PROJECTS.filter((p) => key === 'all' ? true : key === 'done' ? p.stage === '완료' : key === 'mine' ? p.updated.indexOf('김기획') > -1 : p.stage !== '완료');
    return {
      filters: defs.map((d) => ({
        label: d[1], count: pick(d[0]).length, on: f === d[0],
        pick: () => this.setState({ filter: d[0] }),
        style: 'padding:var(--ref-spacing-05) var(--ref-spacing-08);border-radius:var(--ref-radius-04);' + (f === d[0] ? 'background:var(--sys-color-neutral-100);color:var(--sys-color-neutral-800);font-weight:600' : 'color:var(--sys-color-neutral-600);font-weight:500')
      })),
      projects: pick(f).map((p) => {
        const pct = Math.round(p.done / p.total * 100);
        return Object.assign({}, p, {
          stageClass: 'bd-badge ' + STAGE[p.stage],
          bar: 'display:block;height:100%;width:' + pct + '%;background:' + (pct === 100 ? 'var(--sys-color-theme-success-default)' : 'var(--sys-color-brand-primary-default)')
        });
      })
    };
  }
}
</script>
</body>
</html>
