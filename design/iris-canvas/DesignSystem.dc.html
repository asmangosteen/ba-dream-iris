        allClass: 'sq nav-item' + (s.filter === '' ? ' on' : ''),
        all: (e) => { if (e && e.preventDefault) e.preventDefault(); this.setState({ filter: '' }); },
        groups: GROUPS.map((g, gi) => ({ label: g[0], style: 'display:flex;flex-direction:column;' + (gi ? 'margin-top:var(--ref-spacing-10)' : ''), items: g[1].map((c) => ({ name: c[1], pick: pick(c[0]), cls: 'sq nav-item s' + (s.sel === c[0] ? ' on' : '') })) }))
      },
      chips: [['', '전체']].concat(GROUPS.map((g) => [g[0], g[0]])).map((c) => ({ label: c[1], on: s.filter === c[0], cls: 'sq seg-item' + (s.filter === c[0] ? ' on' : ''), pick: () => this.setState({ filter: c[0] }) })),
      cards: cards,
      cur: { name: cur.name, code: cur.code, uses: (USES[cur.id] || FALLBACK).map((u) => ({ screen: u[0], project: u[1], n: u[2] })) }
    };
  }
}
</script>
</body>
</html>
