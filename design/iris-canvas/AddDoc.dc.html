<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Iris 문서 추가</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/da39174b83e31e0b43a8b80c495f7e3a">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
</style>
</helmet>
<div style="width: 100%; min-height: 900px; height: 900px; position: relative; overflow: hidden; background: var(--iris-canvas); font-family: var(--font-family-base); color: var(--sys-color-neutral-800); font-size: var(--typography-body-2-size); line-height: 22px">
  <div aria-hidden="true" style="position: absolute; inset: 0; display: flex; flex-direction: column">
    <div style="height: 56px; background: var(--sys-color-common-white-default)"></div>
    <div style="flex: 1; display: flex"><div style="width: 248px; background: var(--sys-color-common-white-default)"></div><div style="flex: 1" class="canvas-dots"></div><div style="width: 336px; background: var(--sys-color-common-white-default)"></div></div>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: var(--dimmed-bg)"></div>

  <div style="position: relative; min-height: 900px; display: grid; place-items: center; padding: var(--ref-spacing-12)">
    <section role="dialog" aria-modal="true" aria-labelledby="addDocTitle" style="width: 100%; max-width: 560px; background: var(--sys-color-common-white-default); border-radius: var(--ref-radius-08); box-shadow: var(--shadow-05); display: flex; flex-direction: column; overflow: hidden">
      <div style="display: flex; align-items: center; justify-content: space-between; padding: var(--ref-spacing-12) var(--ref-spacing-12) var(--ref-spacing-08)">
        <h1 id="addDocTitle" style="margin: 0; font-size: var(--typography-title-size); line-height: 28px; font-weight: 600; color: var(--sys-color-neutral-800)">문서 추가</h1>
        <a href="Main.dc.html" aria-label="닫기" class="hov" style="width: 32px; height: 32px; border-radius: var(--ref-radius-04); display: grid; place-items: center; color: var(--sys-color-neutral-600)"><span class="ic ic-20 i-close" aria-hidden="true"></span></a>
      </div>

      <div role="tablist" aria-label="문서를 넣는 방법" style="display: flex; gap: var(--ref-spacing-10); padding: 0 var(--ref-spacing-12); box-shadow: inset 0 -1px 0 var(--sys-color-neutral-100)">
        <sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
          <button role="tab" aria-selected="{{t.on}}" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button>
        </sc-for>
      </div>

      <div style="padding: var(--ref-spacing-12); display: flex; flex-direction: column; gap: var(--ref-spacing-10); min-height: 300px; box-sizing: border-box">
        <sc-if value="{{isFile}}" hint-placeholder-val="{{true}}">
          <div style="display: flex; flex-direction: column; gap: var(--ref-spacing-08)">
            <label style="display: flex; flex-direction: column; align-items: center; gap: var(--ref-spacing-06); padding: var(--ref-spacing-14) var(--ref-spacing-10); border-radius: var(--ref-radius-07); box-shadow: inset 0 0 0 1px var(--ref-color-gray-900-20); text-align: center; cursor: pointer">
              <span style="width: 44px; height: 44px; border-radius: 50%; background: var(--sys-color-common-white-default); display: grid; place-items: center; color: var(--sys-color-brand-primary-default); box-shadow: var(--shadow-01)"><span class="ic ic-20 i-upload" aria-hidden="true"></span></span>
              <span style="font-weight: 600; font-size: 16px; line-height: 24px">파일을 끌어다 놓거나 눌러서 골라주세요</span>
              <span style="color: var(--sys-color-neutral-600)">PDF · Word · Markdown, 50MB까지</span>
              <input type="file" class="sr">
            </label>
            <div style="display: flex; align-items: center; gap: var(--ref-spacing-08); padding: var(--ref-spacing-08) var(--ref-spacing-10); border-radius: var(--ref-radius-07); box-shadow: inset 0 0 0 1px var(--iris-line-strong)">
              <span style="width: 36px; height: 36px; border-radius: var(--ref-radius-04); box-shadow: inset 0 0 0 1px var(--iris-line-strong); color: var(--sys-color-neutral-800); display: grid; place-items: center; font-size: 10px; font-weight: 600; flex: none">PDF</span>
              <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--ref-spacing-02)">
                <span style="font-weight: 500">착한구독 개편 기획서 v1.2.pdf</span>
                <span style="height: 4px; border-radius: 2px; background: var(--ref-color-gray-900-5); overflow: hidden"><span style="display: block; width: 100%; height: 100%; background: var(--sys-color-brand-primary-default)"></span></span>
                <span style="font-size: 12px; line-height: 18px; color: var(--sys-color-neutral-600)">2.4MB · 12쪽 · 요구사항 9개를 찾았어요</span>
              </span>
              <button aria-label="파일 빼기" class="hov" style="width: 30px; height: 30px; border-radius: var(--ref-radius-04); display: grid; place-items: center; color: var(--sys-color-neutral-600)"><span class="ic i-trashbin" aria-hidden="true"></span></button>
            </div>
          </div>
        </sc-if>

        <sc-if value="{{isLink}}" hint-placeholder-val="{{false}}">
          <div style="display: flex; flex-direction: column; gap: var(--ref-spacing-08)">
            <div style="display: flex; flex-direction: column; gap: var(--ref-spacing-06)">
              <label for="docUrl" style="font-weight: 500">문서 주소</label>
              <div style="display: flex; align-items: center; gap: var(--ref-spacing-06); height: 48px; padding: 0 var(--ref-spacing-10); border-radius: var(--ref-radius-06); box-shadow: inset 0 0 0 1px var(--sys-color-brand-primary-default)">
                <span class="ic i-link" aria-hidden="true" style="color: var(--sys-color-neutral-500)"></span>
                <input id="docUrl" value="https://docs.google.com/document/d/구독료정책" style="flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 16px">
              </div>
            </div>
            <div style="display: flex; gap: var(--ref-spacing-08); padding: var(--ref-spacing-08) var(--ref-spacing-10); border-radius: var(--ref-radius-07); box-shadow: inset 0 0 0 1px var(--iris-line-strong)">
              <span style="width: 36px; height: 36px; border-radius: var(--ref-radius-04); box-shadow: inset 0 0 0 1px var(--iris-line-strong); color: var(--sys-color-neutral-800); display: grid; place-items: center; flex: none"><span class="ic i-document" aria-hidden="true"></span></span>
              <span style="display: flex; flex-direction: column; gap: var(--ref-spacing-02); min-width: 0">
                <span style="font-weight: 500">구독료 정책 정리</span>
                <span style="color: var(--sys-color-neutral-600)">본문을 가져왔어요. 제목 4개 · 요구사항 3개</span>
              </span>
            </div>
            <div style="display: flex; gap: var(--ref-spacing-06); padding: var(--ref-spacing-08) var(--ref-spacing-10); border-radius: var(--ref-radius-05); background: var(--sys-color-brand-primary-lightest); color: var(--sys-color-brand-primary-default); font-size: 13px; line-height: 20px">
              <span class="ic ic-20 i-info_solid" aria-hidden="true"></span>
              <span>노션 비공개 페이지는 본문을 가져올 수 없어요. 공개로 바꾸거나 본문을 붙여넣어주세요.</span>
            </div>
          </div>
        </sc-if>

        <sc-if value="{{isWrite}}" hint-placeholder-val="{{false}}">
          <div style="display: flex; flex-direction: column; gap: var(--ref-spacing-10)">
            <div style="display: flex; flex-direction: column; gap: var(--ref-spacing-06)">
              <label for="docName" style="font-weight: 500">문서 이름</label>
              <input id="docName" placeholder="예: 신청 플로우 개발 메모" style="height: 48px; padding: 0 var(--ref-spacing-10); border: 0; outline: 0; border-radius: var(--ref-radius-06); box-shadow: inset 0 0 0 1px var(--iris-line-strong); font-size: 16px">
            </div>
            <div style="display: flex; flex-direction: column; gap: var(--ref-spacing-06)">
              <span style="font-weight: 500">어떤 틀로 시작할까요?</span>
              <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--ref-spacing-06)">
                <button style="display: flex; flex-direction: column; gap: var(--ref-spacing-02); padding: var(--ref-spacing-08); border-radius: var(--ref-radius-07); box-shadow: inset 0 0 0 1px var(--sys-color-brand-primary-default); background: var(--sys-color-brand-primary-lightest)"><span style="font-weight: 600; color: var(--sys-color-brand-primary-default)">기획서</span><span style="font-size: 12px; line-height: 18px; color: var(--sys-color-neutral-600)">목적 · 요구사항 표</span></button>
                <button class="hov" style="display: flex; flex-direction: column; gap: var(--ref-spacing-02); padding: var(--ref-spacing-08); border-radius: var(--ref-radius-07); box-shadow: inset 0 0 0 1px var(--iris-line-strong)"><span style="font-weight: 600">개발 메모</span><span style="font-size: 12px; line-height: 18px; color: var(--sys-color-neutral-600)">API · 예외 처리</span></button>
                <button class="hov" style="display: flex; flex-direction: column; gap: var(--ref-spacing-02); padding: var(--ref-spacing-08); border-radius: var(--ref-radius-07); box-shadow: inset 0 0 0 1px var(--iris-line-strong)"><span style="font-weight: 600">빈 문서</span><span style="font-size: 12px; line-height: 18px; color: var(--sys-color-neutral-600)">처음부터 쓰기</span></button>
              </div>
            </div>
          </div>
        </sc-if>

        <div style="display: flex; flex-direction: column; gap: var(--ref-spacing-06)">
          <span style="font-weight: 500">분류</span>
          <div style="display: flex; gap: var(--ref-spacing-04)">
            <sc-for list="{{cats}}" as="c" hint-placeholder-count="4">
              <button onClick="{{c.pick}}" aria-pressed="{{c.on}}" style="{{c.style}}">{{c.label}}</button>
            </sc-for>
          </div>
        </div>
      </div>

      <div style="display: flex; gap: var(--ref-spacing-06); padding: var(--ref-spacing-08) var(--ref-spacing-12) var(--ref-spacing-12)">
        <a href="Main.dc.html" class="bd-button xl tertiary" style="flex: 1">취소</a>
        <a href="DocSplit.dc.html" class="bd-button xl primary" style="flex: 2.25">추가하기</a>
      </div>
    </section>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 'file', cat: 'plan' };
  }
  renderVals() {
    const t = this.state.tab, c = this.state.cat;
    const tabDefs = [['file', '파일 올리기'], ['link', '링크 붙여넣기'], ['write', '직접 쓰기']];
    const catDefs = [['plan', '기획'], ['dev', '개발'], ['design', '디자인'], ['etc', '기타']];
    return {
      isFile: t === 'file', isLink: t === 'link', isWrite: t === 'write',
      tabs: tabDefs.map((d) => ({
        label: d[1], on: t === d[0],
        pick: () => this.setState({ tab: d[0] }),
        style: 'padding:var(--ref-spacing-06) 0 var(--ref-spacing-08);font-size:16px;line-height:24px;' + (t === d[0] ? 'color:var(--sys-color-neutral-800);font-weight:600;box-shadow:inset 0 -2px 0 var(--sys-color-neutral-800)' : 'color:var(--sys-color-neutral-600);font-weight:500')
      })),
      cats: catDefs.map((d) => ({
        label: d[1], on: c === d[0],
        pick: () => this.setState({ cat: d[0] }),
        style: 'padding:var(--ref-spacing-04) var(--ref-spacing-08);border-radius:var(--ref-radius-12);font-weight:500;' + (c === d[0] ? 'background:var(--sys-color-neutral-800);color:var(--sys-color-common-white-default)' : 'box-shadow:inset 0 0 0 1px var(--iris-line-strong);color:var(--sys-color-neutral-700)')
      }))
    };
  }
}
</script>
</body>
</html>
