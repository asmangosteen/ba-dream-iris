<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Iris 피그마 화면 연결</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/39d226866452edcf83473e97d57a021c">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
</style>
</helmet>
<div style="width: 100%; min-height: 900px; height: 900px; position: relative; overflow: hidden; background: var(--iris-canvas); font-family: var(--font-family-base); color: var(--sys-color-neutral-800); font-size: 12px; line-height: 18px">
  <div aria-hidden="true" style="position: absolute; inset: 0">
    <div class="sq float s" style="position: absolute; left: 8px; top: 8px; width: 264px; height: 40px"></div>
    <div class="sq float" style="position: absolute; left: 8px; top: 56px; bottom: 8px; width: 264px"></div>
    <div class="sq float s" style="position: absolute; left: 280px; top: 56px; width: 40px; height: 360px"></div>
    <div class="sq float s" style="position: absolute; right: 8px; top: 8px; width: 288px; height: 40px"></div>
    <div class="sq float" style="position: absolute; right: 8px; top: 56px; bottom: 8px; width: 288px"></div>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: var(--dimmed-bg)"></div>

  <div style="position: relative; min-height: 900px; display: grid; place-items: center; padding: var(--ref-spacing-12)">
    <section role="dialog" aria-modal="true" aria-labelledby="figmaTitle" class="sq" style="width: 100%; max-width: 640px; --sq-fill: var(--sys-color-common-white-default); border-radius: var(--ref-radius-08); filter: drop-shadow(0 12px 20px rgb(69 76 88 / 28%)); display: flex; flex-direction: column; overflow: hidden">
      <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: var(--ref-spacing-08); padding: var(--ref-spacing-12) var(--ref-spacing-12) var(--ref-spacing-10)">
        <h1 id="figmaTitle" style="margin: 0; font-size: 16px; line-height: 24px; font-weight: 600">피그마 화면 가져오기</h1>
        <a href="Main.dc.html" aria-label="닫기" class="ib"><span class="ic ic-20 i-close" aria-hidden="true"></span></a>
      </div>

      <div style="padding: 0 var(--ref-spacing-12) var(--ref-spacing-10); display: flex; flex-direction: column; gap: var(--ref-spacing-06)">
        <label for="figmaUrl" style="font-weight: 500">피그마 링크</label>
        <div style="display: flex; gap: var(--ref-spacing-06)">
          <div class="sq" style="--sq-fill: var(--sys-color-neutral-200); flex: 1; min-width: 0; display: flex; align-items: center; gap: var(--ref-spacing-06); height: 32px; padding: 0 var(--ref-spacing-08); border-radius: var(--ref-radius-03)">
            <span class="ic i-link" aria-hidden="true" style="color: var(--sys-color-neutral-500)"></span>
            <input id="figmaUrl" value="figma.com/design/Ab12Cd/착한구독-신청?node-id=12-345" style="flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 12px">
          </div>
          <button class="act m line" style="color: var(--sys-color-neutral-800)">불러오기</button>
        </div>
      </div>

      <div style="padding: var(--ref-spacing-10) var(--ref-spacing-12); box-shadow: inset 0 1px 0 var(--iris-line-strong), inset 0 -1px 0 var(--iris-line-strong); display: flex; flex-direction: column; gap: var(--ref-spacing-08)">
        <div style="display: flex; align-items: center; justify-content: space-between">
          <span style="font-weight: 600">프레임 4개를 찾았어요</span>
          <button onClick="{{toggleAll}}" style="color: var(--sys-color-brand-primary-default); font-weight: 500; margin-left: auto">{{allLabel}}</button>
        </div>
        <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--ref-spacing-08)">
          <sc-for list="{{frames}}" as="f" hint-placeholder-count="4">
            <button onClick="{{f.toggle}}" aria-pressed="{{f.on}}" style="display: flex; flex-direction: column; gap: var(--ref-spacing-04); text-align: left">
              <span class="sq" data-preview style="{{f.thumbStyle}}" aria-hidden="true">
                <span style="height: 8px; width: 60%; border-radius: 4px; background: var(--ref-color-gray-900-10)"></span>
                <span style="height: 34px; border-radius: 6px; box-shadow: inset 0 0 0 1px var(--ref-color-gray-900-10)"></span>
                <span style="height: 34px; border-radius: 6px; box-shadow: inset 0 0 0 1px var(--ref-color-gray-900-10)"></span>
                <span style="margin-top: auto; height: 16px; border-radius: 4px; background: var(--sys-color-brand-primary-default)"></span>
                <span style="{{f.checkStyle}}"><span class="ic ic-12 i-check" aria-hidden="true"></span></span>
              </span>
              <span style="font-size: 12px; line-height: 18px; font-weight: 500; color: var(--sys-color-neutral-800); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{f.name}}</span>
            </button>
          </sc-for>
        </div>
      </div>

      <div style="padding: var(--ref-spacing-10) var(--ref-spacing-12); display: flex; flex-direction: column; gap: var(--ref-spacing-06)">
        <div style="display: flex; align-items: center; justify-content: space-between; gap: var(--ref-spacing-08)">
          <span style="font-weight: 500">놓을 페이지</span>
          <button class="sq" style="--sq-fill: var(--sys-color-neutral-200); display: flex; align-items: center; gap: var(--ref-spacing-06); height: 32px; padding: 0 var(--ref-spacing-08) 0 var(--ref-spacing-10); border-radius: var(--ref-radius-03); font-weight: 500">신청 플로우 <span class="ic i-chevron_down" aria-hidden="true" style="color: var(--sys-color-neutral-600)"></span></button>
        </div>      </div>

      <div style="display: flex; gap: var(--ref-spacing-06); padding: var(--ref-spacing-04) var(--ref-spacing-12) var(--ref-spacing-12)">
        <a href="Main.dc.html" class="act m gray" style="flex: 1">취소</a>
        <a href="Main.dc.html" class="act m pri" style="flex: 2.25">{{cta}}</a>
      </div>
    </section>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
const FRAMES = [
  { id: 'a', name: '신청_01_차종선택', meta: '375 × 812 · 컴포넌트 4' },
  { id: 'b', name: '신청_02_구독료선택', meta: '375 × 812 · 컴포넌트 5' },
  { id: 'c', name: '신청_02_상세시트', meta: '375 × 812 · 컴포넌트 3' },
  { id: 'd', name: '신청_05_완료', meta: '375 × 812 · 컴포넌트 2' }
];
/* Corner smoothing 60% — @ba-dream/design-system squircle-apply 와 같은 figma-squircle 경로 (작업 캔버스 안 화면 제외) */
function irisSquircle() {
  if (window.__irisSq) return;
  window.__irisSq = true;
  const SEL = '.sq,.bd-button,.bd-chip,.ib,.fld,.btn-ink,.float,.seg-item,.rail-btn,.dd,.menu,.menu-item,.grp,.act,.field';
  const S = 0.6;
  const f = (n) => n.toFixed(3);
  const corner = (r, budget) => {
    if (!r) return null;
    const sm = Math.min(S, budget / r - 1);
    const p = Math.min((1 + S) * r, budget);
    const arc = 90 * (1 - sm);
    const L = Math.sin((arc / 2) * Math.PI / 180) * r * Math.SQRT2;
    const p34 = r * Math.tan(((90 - arc) / 4) * Math.PI / 180);
    const beta = (45 * sm) * Math.PI / 180;
    const c = p34 * Math.cos(beta), d = c * Math.tan(beta);
    const b = (p - L - c - d) / 3, a = 2 * b;
    return { r, a, b, c, d, p, L };
  };
  const path = (w, h, rad, x, y) => {
    const budget = Math.min(w, h) / 2;
    const k = corner(Math.min(rad, budget), budget);
    if (!k) return 'M ' + f(x) + ' ' + f(y) + ' h ' + f(w) + ' v ' + f(h) + ' h ' + f(-w) + ' Z';
    const { r, a, b, c, d, p, L } = k, A = a + b + c, R = f(r) + ' ' + f(r) + ' 0 0 1 ';
    return 'M ' + f(x + w - p) + ' ' + f(y) +
      ' c ' + f(a) + ' 0 ' + f(a + b) + ' 0 ' + f(A) + ' ' + f(d) + ' a ' + R + f(L) + ' ' + f(L) + ' c ' + f(d) + ' ' + f(c) + ' ' + f(d) + ' ' + f(b + c) + ' ' + f(d) + ' ' + f(A) +
      ' L ' + f(x + w) + ' ' + f(y + h - p) +
      ' c 0 ' + f(a) + ' 0 ' + f(a + b) + ' ' + f(-d) + ' ' + f(A) + ' a ' + R + f(-L) + ' ' + f(L) + ' c ' + f(-c) + ' ' + f(d) + ' ' + f(-(b + c)) + ' ' + f(d) + ' ' + f(-A) + ' ' + f(d) +
      ' L ' + f(x + p) + ' ' + f(y + h) +
      ' c ' + f(-a) + ' 0 ' + f(-(a + b)) + ' 0 ' + f(-A) + ' ' + f(-d) + ' a ' + R + f(-L) + ' ' + f(-L) + ' c ' + f(-d) + ' ' + f(-c) + ' ' + f(-d) + ' ' + f(-(b + c)) + ' ' + f(-d) + ' ' + f(-A) +
      ' L ' + f(x) + ' ' + f(y + p) +
      ' c 0 ' + f(-a) + ' 0 ' + f(-(a + b)) + ' ' + f(d) + ' ' + f(-A) + ' a ' + R + f(L) + ' ' + f(-L) + ' c ' + f(c) + ' ' + f(-d) + ' ' + f(b + c) + ' ' + f(-d) + ' ' + f(A) + ' ' + f(-d) + ' Z';
  };
  const last = new WeakMap(), seen = new WeakSet();
  const apply = (el) => {
    const w = el.offsetWidth, h = el.offsetHeight;
    if (!(w > 0 && h > 0)) return;
    const cs = getComputedStyle(el);
    const raw = cs.borderTopLeftRadius;
    let r = parseFloat(raw) || 0;
    if (raw.trim().endsWith('%')) r = Math.min(w, h) * r / 100;
    const lw = parseFloat(cs.getPropertyValue('--sq-line-w')) || 0;
    const key = w + '|' + h + '|' + r + '|' + lw;
    if (last.get(el) === key && el.style.getPropertyValue('--sq-path')) return;
    last.set(el, key);
    if (r <= 0) { el.removeAttribute('data-sq'); return; }
    const outer = path(w, h, r, 1, 1);
    el.style.setProperty('--sq-path', "path('" + outer + "')");
    el.style.setProperty('--sq-ring', lw > 0 && w > lw * 2 && h > lw * 2 ? "path(evenodd, '" + outer + ' ' + path(w - lw * 2, h - lw * 2, Math.max(r - lw, 0), 1 + lw, 1 + lw) + "')" : 'inset(50%)');
    if (el.classList.contains('sq-clip')) el.style.setProperty('--sq-clip', "path('" + path(w, h, r, 0, 0) + "')");
    if (!el.hasAttribute('data-sq')) el.setAttribute('data-sq', '');
  };
  let raf = 0;
  const ro = new ResizeObserver((es) => es.forEach((e) => apply(e.target)));
  const tick = () => {
    raf = 0;
    document.querySelectorAll(SEL).forEach((el) => { if (!seen.has(el)) { seen.add(el); ro.observe(el); } apply(el); });
  };
  new MutationObserver(() => { if (!raf) raf = requestAnimationFrame(tick); }).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ['class', 'style'] });
  tick();
  if (document.fonts) document.fonts.ready.then(tick);
}
class Component extends DCLogic {
  componentDidMount() { irisSquircle(); }
  constructor(props) {
    super(props);
    this.state = { picked: { a: true, b: true, c: true, d: false } };
  }
  renderVals() {
    const p = this.state.picked;
    const n = FRAMES.filter((f) => p[f.id]).length;
    const all = n === FRAMES.length;
    return {
      cta: n ? '화면 ' + n + '개 가져오기' : '화면을 골라주세요',
      allLabel: all ? '모두 빼기' : '모두 고르기',
      toggleAll: () => { const next = {}; FRAMES.forEach((f) => { next[f.id] = !all; }); this.setState({ picked: next }); },
      frames: FRAMES.map((f) => {
        const on = !!p[f.id];
        return {
          name: f.name, meta: f.meta, on: on,
          toggle: () => { const next = Object.assign({}, p); next[f.id] = !on; this.setState({ picked: next }); },
          thumbStyle: 'position:relative;display:flex;flex-direction:column;gap:5px;height:190px;padding:12px 9px;box-sizing:border-box;border-radius:var(--ref-radius-04);--sq-fill:var(--sys-color-common-white-default);' + (on ? '--sq-line:var(--sys-color-brand-primary-default);--sq-line-w:0.5px' : '--sq-line:var(--iris-line-strong);--sq-line-w:1px;opacity:.6'),
          checkStyle: 'position:absolute;top:6px;right:6px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;' + (on ? 'background:var(--sys-color-brand-primary-default);color:var(--sys-color-common-white-default)' : 'background:var(--sys-color-common-white-default);color:transparent;box-shadow:inset 0 0 0 1px var(--sys-color-neutral-400)')
        };
      })
    };
  }
}
</script>
</body>
</html>
