<title>Iris 프로토타입</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 레이아웃: 회색 캔버스 위 흰 카드 하나 — 화면 묶음별 링크 목록 (Iris 앱 셸과 같은 결) */
@font-face{font-family:'Pretendard';src:url('assets/fonts/Pretendard-Regular.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Pretendard';src:url('assets/fonts/Pretendard-Medium.woff2') format('woff2');font-weight:500;font-display:swap}
@font-face{font-family:'Pretendard';src:url('assets/fonts/Pretendard-SemiBold.woff2') format('woff2');font-weight:600;font-display:swap}
:root{
  --canvas:#F6F7F7; --panel:#FFFFFF; --line:rgb(3 9 26 / 8%); --ink:#202837; --muted:#8C9199; --soft:#F1F2F3; --accent:#2C7BE2;
  --font:'Pretendard',system-ui,-apple-system,'Apple SD Gothic Neo',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--canvas:#0F131A;--panel:#171C25;--line:rgb(255 255 255 / 9%);--ink:#E8EAED;--muted:#8C9199;--soft:#212734;--accent:#5B9BF0;color-scheme:dark}}
:root[data-theme="dark"]{--canvas:#0F131A;--panel:#171C25;--line:rgb(255 255 255 / 9%);--ink:#E8EAED;--muted:#8C9199;--soft:#212734;--accent:#5B9BF0;color-scheme:dark}
body{background:var(--canvas);color:var(--ink);font-family:var(--font);font-size:12px;line-height:18px;-webkit-font-smoothing:antialiased;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:32px}
.card{max-width:720px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:20px}
h1{margin:0;font-size:16px;line-height:24px;font-weight:600;text-wrap:balance}
.group{display:flex;flex-direction:column;gap:2px}
.group h2{margin:0 0 4px;font-size:12px;line-height:18px;font-weight:600}
a.row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:32px;padding:0 10px;margin:0 -10px;border-radius:8px;color:var(--ink);text-decoration:none}
a.row:hover{background:var(--soft)}
a.row:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
a.row span:last-child{color:var(--muted);font-variant-numeric:tabular-nums}
.note{color:var(--muted)}
</style>
